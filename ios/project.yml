name: FaceNative
options:
  bundleIdPrefix: cn.guanyue.face
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: cn.guanyue.face.ios
    DEVELOPMENT_TEAM: KMF5U4LK8D
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_BITCODE: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0.0"
targets:
  FaceNative:
    type: application
    platform: iOS
    sources:
      - path: FaceNative
        excludes:
          - "**/.gitkeep"
          - "WebRoot"
          - "WebRoot/**"
          - "Assets.xcassets"
          - "Assets.xcassets/**"
    resources:
      - path: FaceNative/WebRoot
        type: folder
      - path: FaceNative/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: FaceNative/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: cn.guanyue.face.ios
        PRODUCT_NAME: FaceNative
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: KMF5U4LK8D
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "FaceNative App Store"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
schemes:
  FaceNative:
    build:
      targets:
        FaceNative: all
    run:
      config: Debug
    archive:
      config: Release
